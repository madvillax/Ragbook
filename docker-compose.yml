services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ragbook
      POSTGRES_USER: ragbook
      POSTGRES_PASSWORD: ragbook
    ports:
      - "5432:5432"
    volumes:
      - ragbook-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbook -d ragbook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ragbook-postgres:

